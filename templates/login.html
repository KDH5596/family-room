<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가족 공간 로그인</title>
    <style>
        body {
            background-color: #313338;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #dbdee1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid #1f2023;
        }
        h1 { font-size: 1.6em; margin-bottom: 15px; color: #ffffff; }
        p { color: #949ba4; margin-bottom: 30px; font-size: 0.95em; line-height: 1.4; }
        .login-btn {
            background-color: #5865f2;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            transition: background 0.2s;
        }
        .login-btn:hover { background-color: #4752c4; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>👋 환영합니다!</h1>
        <p>가족들과 디스코드처럼 소통하려면<br>Google 계정으로 로그인해 주세요.</p>
        <a href="/login" class="login-btn">Google로 로그인하기</a>
    </div>
</body>
</html>
